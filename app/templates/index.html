<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 旅行助手 - 智能行程规划</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --primary: #10a37f;
            --primary-dark: #0d8a6c;
            --secondary: #64748b;
            --bg-dark: #212121;
            --bg-light: #ffffff;
            --text-dark: #ececec;
            --text-light: #1a1a1a;
            --border-dark: #424242;
            --border-light: #e5e5e5;
        }

        * {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        code, pre {
            font-family: 'JetBrains Mono', monospace;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-light);
        }

        /* 侧边栏样式 */
        .sidebar {
            background-color: #ffffff;
            border-right: 1px solid #e5e5e5;
            transition: transform 0.3s ease;
        }

        .sidebar-item {
            transition: all 0.2s ease;
            color: #374151;
        }

        .sidebar-item:hover {
            background-color: #f3f4f6;
        }

        /* 主对话区域 */
        .chat-container {
            background-color: var(--bg-light);
        }

        /* 消息气泡样式 */
        .message-user {
            background-color: #f4f4f4;
            border-radius: 8px;
        }

        .message-ai {
            background-color: transparent;
        }

        /* 输入区域 */
        .input-container {
            background-color: var(--bg-light);
            border-top: 1px solid #e5e5e5;
        }

        .input-box {
            background-color: #ffffff;
            border: 1px solid #e5e5e5;
            border-radius: 12px;
            transition: all 0.2s ease;
        }

        .input-box:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(16, 163, 127, 0.1);
        }

        /* 按钮样式 */
        .btn-primary {
            background-color: var(--primary);
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            background-color: var(--primary-dark);
        }

        .btn-primary:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        /* 滚动条 */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* 消息动画 */
        .message-enter {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 打字指示器 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background-color: #888;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0.8);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* 订单卡片 */
        .order-card {
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .order-card:hover {
            border-color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 模态框 */
        .modal-overlay {
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                z-index: 50;
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }
        }

        /* Markdown 样式 */
        .markdown-content h1,
        .markdown-content h2,
        .markdown-content h3 {
            font-weight: 600;
            margin: 16px 0 8px;
        }

        .markdown-content p {
            margin: 8px 0;
            line-height: 1.6;
        }

        .markdown-content ul,
        .markdown-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .markdown-content li {
            margin: 4px 0;
        }

        .markdown-content code {
            background-color: #f4f4f4;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .markdown-content pre {
            background-color: #f4f4f4;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .markdown-content pre code {
            background-color: transparent;
            padding: 0;
        }
    </style>
</head>
<body class="min-h-screen bg-white">
<div class="flex h-screen">
    <!-- 侧边栏 -->
    <aside id="sidebar" class="sidebar w-64 flex-shrink-0 flex flex-col h-full">
        <!-- 侧边栏头部 -->
        <div class="p-4 border-b border-gray-200">
            <button onclick="createNewChat()" class="w-full flex items-center gap-3 px-4 py-3 border border-gray-300 rounded-lg hover:bg-gray-100 transition-colors text-gray-700">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>新对话</span>
            </button>
        </div>

        <!-- 历史对话列表 -->
        <div class="flex-1 overflow-y-auto custom-scrollbar p-2">
            <p class="text-xs text-gray-500 px-3 mb-2" id="historyCount">加载中...</p>
            <div id="historyList" class="space-y-1">
                <!-- 历史对话项将通过JS动态加载 -->
            </div>
        </div>

        <!-- 侧边栏底部 -->
        <div class="p-4 border-t border-gray-200">
            <button onclick="clearAllHistory()" class="w-full flex items-center gap-3 px-4 py-2 text-gray-500 hover:text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
                <span>清空历史</span>
            </button>
        </div>
    </aside>

    <!-- 主内容区 -->
    <main class="flex-1 flex flex-col h-full chat-container">
        <!-- 顶部导航 -->
        <header class="flex items-center justify-between px-4 py-3 border-b border-gray-200">
            <div class="flex items-center gap-3">
                <button onclick="toggleSidebar()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors lg:hidden">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                    </svg>
                </button>
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-gray-800">AI 旅行助手</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="showQuickRecommend()" class="flex items-center gap-2 px-3 py-1.5 text-sm text-gray-700 hover:bg-gray-100 rounded-lg transition-colors">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span class="hidden sm:inline">快速推荐</span>
                </button>
                <button onclick="refreshOrders()" class="p-2 hover:bg-gray-100 rounded-lg transition-colors" title="刷新订单">
                    <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- 对话区域 -->
        <div class="flex-1 overflow-y-auto custom-scrollbar">
            <div id="chatMessages" class="max-w-3xl mx-auto px-4 py-8 space-y-6">
                <!-- 欢迎消息 -->
                <div class="message-enter flex gap-4">
                    <div class="w-8 h-8 rounded-full bg-[#10a37f] flex-shrink-0 flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                        </svg>
                    </div>
                    <div class="flex-1 message-ai">
                        <p class="text-gray-800 text-sm leading-relaxed">
                            👋 您好！我是 AI 旅行助手，可以帮您：
                        </p>
                        <ul class="mt-2 text-gray-700 text-sm space-y-1.5">
                            <li class="flex items-center gap-2">✈️ 查询和预订机票</li>
                            <li class="flex items-center gap-2">🏨 查询和预订酒店</li>
                            <li class="flex items-center gap-2">🎒 查询和预订旅游产品</li>
                            <li class="flex items-center gap-2">📋 管理您的订单</li>
                            <li class="flex items-center gap-2">🎯 根据预算智能推荐行程</li>
                        </ul>
                        <p class="mt-3 text-gray-700 text-sm">
                            请告诉我您的需求，例如："我想查北京到上海的航班" 或 "推荐三亚3天行程，预算3000元"
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 输入区域 -->
        <div class="input-container px-4 py-4">
            <div class="max-w-3xl mx-auto">
                <div class="input-box flex items-end gap-3 p-3">
                    <textarea
                            id="messageInput"
                            placeholder="发送消息给 AI 旅行助手..."
                            class="flex-1 resize-none border-none outline-none text-gray-800 placeholder-gray-400 bg-transparent max-h-32"
                            rows="1"
                            onkeydown="handleKeyDown(event)"
                            oninput="autoResize(this)"
                    ></textarea>
                    <button
                            onclick="sendMessage()"
                            id="sendBtn"
                            class="btn-primary p-2 rounded-lg text-white disabled:opacity-50 disabled:cursor-not-allowed"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path>
                        </svg>
                    </button>
                </div>
                <p class="text-xs text-gray-400 text-center mt-2">
                    AI 可能产生错误信息，请核实重要内容。
                </p>
            </div>
        </div>
    </main>

    <!-- 订单面板（右侧） -->
    <aside id="orderPanel" class="w-80 border-l border-gray-200 bg-white flex flex-col h-full hidden lg:flex">
        <div class="p-4 border-b border-gray-200">
            <div class="flex items-center justify-between">
                <h2 class="font-semibold text-gray-800">我的订单</h2>
                <select id="orderFilter" onchange="filterOrders()" class="text-sm border border-gray-300 rounded-lg px-2 py-1 focus:outline-none focus:border-[#10a37f]">
                    <option value="all">全部</option>
                    <option value="flight">机票</option>
                    <option value="hotel">酒店</option>
                    <option value="product">旅游产品</option>
                </select>
            </div>
            <p class="text-xs text-gray-500 mt-1" id="orderCount">加载中...</p>
        </div>

        <div id="orderList" class="flex-1 overflow-y-auto custom-scrollbar p-4 space-y-3">
            <!-- 订单卡片将通过 JS 动态加载 -->
            <div class="text-center py-10 text-gray-400">
                <svg class="w-14 h-14 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                </svg>
                <p>加载订单中...</p>
            </div>
        </div>

        <div id="orderStats" class="p-4 border-t border-gray-200 bg-gray-50 hidden">
            <div class="grid grid-cols-3 gap-4 text-center">
                <div>
                    <p class="text-xl font-bold text-[#10a37f]" id="statFlight">0</p>
                    <p class="text-xs text-gray-500">机票</p>
                </div>
                <div>
                    <p class="text-xl font-bold text-[#8b5cf6]" id="statHotel">0</p>
                    <p class="text-xs text-gray-500">酒店</p>
                </div>
                <div>
                    <p class="text-xl font-bold text-[#ec4899]" id="statProduct">0</p>
                    <p class="text-xs text-gray-500">旅游产品</p>
                </div>
            </div>
        </div>
    </aside>
</div>

<!-- 快速推荐弹窗 -->
<div id="quickRecommendModal" class="fixed inset-0 z-50 hidden items-center justify-center p-4 modal-overlay">
    <div class="bg-white rounded-xl shadow-2xl max-w-md w-full p-6">
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-lg font-semibold text-gray-800">快速推荐</h3>
            <button onclick="hideQuickRecommend()" class="text-gray-400 hover:text-gray-600">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                </svg>
            </button>
        </div>
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">目的地</label>
                <input type="text" id="recommendDestination" placeholder="例如：三亚、北京、上海" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#10a37f]">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">预算（元）</label>
                <input type="number" id="recommendBudget" placeholder="例如：3000" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#10a37f]">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">天数</label>
                <input type="number" id="recommendDays" placeholder="例如：3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:border-[#10a37f]">
            </div>
            <button onclick="submitQuickRecommend()" class="w-full py-2 bg-[#10a37f] text-white rounded-lg hover:bg-[#0d8a6c] transition-colors">
                获取推荐
            </button>
        </div>
    </div>
</div>

<script>
    // 全局变量
    let currentSessionId = null;
    let isGenerating = false;

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
        currentSessionId = generateSessionId();
        loadHistory();
        loadOrders();
    });

    // 生成会话ID
    function generateSessionId() {
        return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    // 切换侧边栏
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        sidebar.classList.toggle('open');
    }

    // 创建新对话
    function createNewChat() {
        currentSessionId = generateSessionId();
        document.getElementById('chatMessages').innerHTML = `
            <div class="message-enter flex gap-4">
                <div class="w-8 h-8 rounded-full bg-[#10a37f] flex-shrink-0 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div class="flex-1 message-ai">
                    <p class="text-gray-800 text-sm leading-relaxed">
                        👋 您好！我是 AI 旅行助手，可以帮您：
                    </p>
                    <ul class="mt-2 text-gray-700 text-sm space-y-1.5">
                        <li class="flex items-center gap-2">✈️ 查询和预订机票</li>
                        <li class="flex items-center gap-2">🏨 查询和预订酒店</li>
                        <li class="flex items-center gap-2">🎒 查询和预订旅游产品</li>
                        <li class="flex items-center gap-2">📋 管理您的订单</li>
                        <li class="flex items-center gap-2">🎯 根据预算智能推荐行程</li>
                    </ul>
                    <p class="mt-3 text-gray-700 text-sm">
                        请告诉我您的需求，例如："我想查北京到上海的航班" 或 "推荐三亚3天行程，预算3000元"
                    </p>
                </div>
            </div>
        `;
    }

    // 处理键盘事件
    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            sendMessage();
        }
    }

    // 自动调整文本框高度
    function autoResize(textarea) {
        textarea.style.height = 'auto';
        textarea.style.height = Math.min(textarea.scrollHeight, 128) + 'px';
    }

    // 发送消息
    async function sendMessage() {
        const input = document.getElementById('messageInput');
        const message = input.value.trim();
        
        if (!message || isGenerating) return;
        
        isGenerating = true;
        document.getElementById('sendBtn').disabled = true;
        
        // 添加用户消息
        addMessage('user', message);
        input.value = '';
        input.style.height = 'auto';
        
        // 显示打字指示器
        const typingIndicator = addTypingIndicator();
        
        try {
            const response = await fetch('/chat/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    message: message,
                    session_id: currentSessionId
                })
            });
            
            if (!response.ok) throw new Error('Network response was not ok');
            
            // 移除打字指示器
            typingIndicator.remove();
            
            // 添加AI消息容器
            const aiMessageContainer = addMessage('ai', '');
            
            // 处理流式响应
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullResponse = '';
            
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                
                const chunk = decoder.decode(value);
                const lines = chunk.split('\n');
                
                for (const line of lines) {
                    if (line.startsWith('data: ')) {
                        const data = JSON.parse(line.slice(6));
                        if (data.content) {
                            fullResponse += data.content;
                            aiMessageContainer.innerHTML = formatMessage(fullResponse);
                        }
                        if (data.done) {
                            isGenerating = false;
                            document.getElementById('sendBtn').disabled = false;
                        }
                    }
                }
            }
            
            // 刷新历史列表
            loadHistory();
        } catch (error) {
            console.error('Error sending message:', error);
            isGenerating = false;
            document.getElementById('sendBtn').disabled = false;
            document.getElementById('typingIndicator').style.display = 'none';
        }
    }

    // 添加消息
    function addMessage(role, content) {
        const chatMessages = document.getElementById('chatMessages');
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message-enter flex gap-4';
        
        if (role === 'user') {
            messageDiv.innerHTML = `
                <div class="flex-1 message-user px-4 py-3">
                    <p class="text-gray-800 text-sm">${escapeHtml(content)}</p>
                </div>
                <div class="w-8 h-8 rounded-full bg-blue-500 flex-shrink-0 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
            `;
        } else {
            messageDiv.innerHTML = `
                <div class="w-8 h-8 rounded-full bg-[#10a37f] flex-shrink-0 flex items-center justify-center">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div class="flex-1 message-ai markdown-content">
                    ${formatMessage(content)}
                </div>
            `;
        }
        
        chatMessages.appendChild(messageDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        return messageDiv.querySelector('.markdown-content') || messageDiv.querySelector('.message-user');
    }

    // 添加打字指示器
    function addTypingIndicator() {
        const chatMessages = document.getElementById('chatMessages');
        const indicatorDiv = document.createElement('div');
        indicatorDiv.className = 'message-enter flex gap-4';
        indicatorDiv.innerHTML = `
            <div class="w-8 h-8 rounded-full bg-[#10a37f] flex-shrink-0 flex items-center justify-center">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <div class="flex-1">
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        `;
        
        chatMessages.appendChild(indicatorDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        
        return indicatorDiv;
    }

    // 格式化消息
    function formatMessage(content) {
        if (!content) return '';
        
        // 简单的Markdown格式化
        let formatted = escapeHtml(content);
        
        // 代码块
        formatted = formatted.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
        
        // 行内代码
        formatted = formatted.replace(/`([^`]+)`/g, '<code>$1</code>');
        
        // 粗体
        formatted = formatted.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        
        // 斜体
        formatted = formatted.replace(/\*([^*]+)\*/g, '<em>$1</em>');
        
        // 换行
        formatted = formatted.replace(/\n/g, '<br>');
        
        return formatted;
    }

    // HTML转义
    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // 加载历史对话
    async function loadHistory() {
        try {
            const response = await fetch('/chat/sessions');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            
            const historyList = document.getElementById('historyList');
            historyList.innerHTML = '';
            
            if (data.sessions && data.sessions.length > 0) {
                data.sessions.forEach(session => {
                    const historyItem = document.createElement('div');
                    historyItem.className = 'sidebar-item px-3 py-2 rounded-lg cursor-pointer text-gray-600 hover:text-gray-900 hover:bg-gray-100';
                    const content = session.last_message.substring(0, 50);
                    historyItem.textContent = content + (session.last_message.length > 50 ? '...' : '');
                    historyItem.onclick = () => loadSession(session.session_id);
                    historyList.appendChild(historyItem);
                });
            }
            
            document.getElementById('historyCount').textContent = '共 ' + (data.total || 0) + ' 个会话';
        } catch (error) {
            console.error('Error loading history:', error);
            document.getElementById('historyCount').textContent = '加载失败';
        }
    }

    // 清空所有历史
    async function clearAllHistory() {
        if (confirm('确定要清空所有历史对话吗？')) {
            try {
                // 调用新的清空所有会话API
                await fetch('/chat/history', {
                    method: 'DELETE'
                });
                loadHistory();
                createNewChat();
            } catch (error) {
                console.error('Error clearing history:', error);
            }
        }
    }

    // 加载指定会话
    async function loadSession(sessionId) {
        try {
            // 更新当前会话ID
            currentSessionId = sessionId;
            
            // 获取会话历史
            const response = await fetch('/chat/history/' + sessionId);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            
            // 清空当前聊天区域
            const chatMessages = document.getElementById('chatMessages');
            chatMessages.innerHTML = '';
            
            // 添加历史消息
            if (data.history && data.history.length > 0) {
                data.history.forEach(msg => {
                    addMessage(msg.role, msg.content);
                });
            }
            
            // 滚动到底部
            chatMessages.scrollTop = chatMessages.scrollHeight;
        } catch (error) {
            console.error('Error loading session:', error);
        }
    }

    // 加载订单
    async function loadOrders() {
        try {
            const response = await fetch('/orders');
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            const data = await response.json();
            
            // 处理API可能返回对象或数组的情况
            const orders = Array.isArray(data) ? data : (data.orders || []);
            
            const orderList = document.getElementById('orderList');
            orderList.innerHTML = '';
            
            if (orders.length === 0) {
                orderList.innerHTML = `
                    <div class="text-center py-10 text-gray-400">
                        <svg class="w-14 h-14 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                        </svg>
                        <p>暂无订单</p>
                    </div>
                `;
            } else {
                orders.forEach(order => {
                    const orderCard = createOrderCard(order);
                    orderList.appendChild(orderCard);
                });
            }
            
            document.getElementById('orderCount').textContent = `共 ${orders.length} 个订单`;
            updateOrderStats(orders);
        } catch (error) {
            console.error('Error loading orders:', error);
            // 显示错误信息
            const orderList = document.getElementById('orderList');
            orderList.innerHTML = `
                <div class="text-center py-10 text-red-400">
                    <svg class="w-14 h-14 mx-auto mb-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <p>加载失败</p>
                    <p class="text-xs mt-2">${error.message}</p>
                </div>
            `;
            document.getElementById('orderCount').textContent = '加载失败';
        }
    }

    // 创建订单卡片
    function createOrderCard(order) {
        const card = document.createElement('div');
        card.className = 'order-card p-4 bg-white';
        card.setAttribute('data-order-type', order.order_type);  // 添加订单类型属性
        
        const typeIcons = {
            flight: '✈️',
            hotel: '🏨',
            product: '🎒'
        };
        
        const statusColors = {
            confirmed: 'text-green-600',
            pending: 'text-yellow-600',
            cancelled: 'text-red-600'
        };
        
        card.innerHTML = `
            <div class="flex items-start justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-lg">${typeIcons[order.order_type] || '📋'}</span>
                    <div>
                        <h4 class="font-medium text-gray-800 text-sm">${order.item_name}</h4>
                        <p class="text-xs text-gray-500">订单号: ${order.id}</p>
                    </div>
                </div>
                <span class="text-xs ${statusColors[order.status] || 'text-gray-600'}">${order.status}</span>
            </div>
            <div class="mt-2 flex items-center justify-between">
                <span class="text-sm font-medium text-[#10a37f]">¥${order.total_price.toFixed(2)}</span>
                ${order.status !== 'cancelled' ? `
                    <button onclick="cancelOrder(${order.id})" class="text-xs text-red-500 hover:text-red-700">
                        取消订单
                    </button>
                ` : ''}
            </div>
        `;
        
        return card;
    }

    // 更新订单统计
    function updateOrderStats(orders) {
        const stats = {
            flight: 0,
            hotel: 0,
            product: 0
        };
        
        orders.forEach(order => {
            if (stats.hasOwnProperty(order.order_type)) {
                stats[order.order_type]++;
            }
        });
        
        document.getElementById('statFlight').textContent = stats.flight;
        document.getElementById('statHotel').textContent = stats.hotel;
        document.getElementById('statProduct').textContent = stats.product;
        
        const statsDiv = document.getElementById('orderStats');
        if (orders.length > 0) {
            statsDiv.classList.remove('hidden');
        } else {
            statsDiv.classList.add('hidden');
        }
    }

    // 取消订单
    async function cancelOrder(orderId) {
        if (confirm('确定要取消这个订单吗？')) {
            try {
                await fetch(`/orders/${orderId}/cancel`, {
                    method: 'POST'
                });
                loadOrders();
            } catch (error) {
                console.error('Error cancelling order:', error);
                alert('取消订单失败，请稍后重试');
            }
        }
    }

    // 过滤订单
    function filterOrders() {
        const filter = document.getElementById('orderFilter').value;
        const orderCards = document.querySelectorAll('.order-card');
        
        orderCards.forEach(card => {
            if (filter === 'all') {
                card.style.display = 'block';
            } else {
                const orderType = card.getAttribute('data-order-type');
                card.style.display = orderType === filter ? 'block' : 'none';
            }
        });
    }

    // 刷新订单
    function refreshOrders() {
        loadOrders();
    }

    // 显示快速推荐弹窗
    function showQuickRecommend() {
        document.getElementById('quickRecommendModal').classList.remove('hidden');
        document.getElementById('quickRecommendModal').classList.add('flex');
    }

    // 隐藏快速推荐弹窗
    function hideQuickRecommend() {
        document.getElementById('quickRecommendModal').classList.add('hidden');
        document.getElementById('quickRecommendModal').classList.remove('flex');
    }

    // 提交快速推荐
    async function submitQuickRecommend() {
        const destination = document.getElementById('recommendDestination').value;
        const budget = document.getElementById('recommendBudget').value;
        const days = document.getElementById('recommendDays').value;
        
        if (!destination || !budget || !days) {
            alert('请填写所有字段');
            return;
        }
        
        hideQuickRecommend();
        
        const message = `我想去${destination}玩${days}天，预算${budget}元，请帮我推荐行程`;
        document.getElementById('messageInput').value = message;
        sendMessage();
    }
</script>
